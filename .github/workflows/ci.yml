name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr ffmpeg espeak-ng poppler-utils

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy .

      - name: Run unit tests
        run: uv run python -m pytest tests/unit/ -v

      - name: Run infrastructure tests
        run: uv run python -m pytest tests/infrastructure/ -v

      - name: Run integration tests
        run: uv run python -m pytest tests/integration/ -v

      - name: Run benchmark tests
        run: uv run python -m pytest tests/benchmarks/ -v
