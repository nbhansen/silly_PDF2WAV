# Pre-commit hooks for automated code quality enforcement
# Install with: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Ruff - Fast comprehensive Python linting and auto-fixing
  - repo: local
    hooks:
      - id: ruff
        name: ruff-linting
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        description: "Run Ruff linter with auto-fix (project venv, same as CI)"
      - id: ruff-format
        name: ruff-formatting
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        description: "Run Ruff formatter (project venv, same as CI)"

  # MyPy - Type checking
  - repo: local
    hooks:
      - id: mypy
        name: mypy-type-checking
        entry: uv run mypy .
        language: system
        pass_filenames: false
        description: "Static type checking with MyPy (project venv, same as CI)"

  # Bandit - Security vulnerability scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        name: bandit-security
        args: [-c, pyproject.toml]
        description: "Security vulnerability scanning"

  # General file quality checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: trim-trailing-whitespace
        description: "Remove trailing whitespace"
      - id: end-of-file-fixer
        name: fix-end-of-file
        description: "Ensure files end with newline"
      - id: check-yaml
        name: check-yaml-syntax
        description: "Validate YAML syntax"
      - id: check-json
        name: check-json-syntax
        description: "Validate JSON syntax"
      - id: check-merge-conflict
        name: check-merge-conflicts
        description: "Check for merge conflict markers"
      - id: check-added-large-files
        name: check-large-files
        args: ['--maxkb=1000']
        description: "Prevent large files from being committed"

  # Python-specific checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
        name: python-ast-check
        description: "Check Python AST syntax"
      - id: debug-statements
        name: python-debug-check
        description: "Check for debugger imports and breakpoints"

# Configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
